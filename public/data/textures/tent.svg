<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <!-- White tent texture with shading -->
  <defs>
    <!-- Subtle fabric pattern -->
    <pattern id="fabricTexture" patternUnits="userSpaceOnUse" width="4" height="4">
      <rect width="4" height="4" fill="#ffffff"/>
      <line x1="0" y1="0" x2="4" y2="0" stroke="#f5f5f5" stroke-width="1"/>
    </pattern>
    
    <!-- Ridge shadow gradient -->
    <linearGradient id="ridgeShadow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#e8e8e8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f5f5f5;stop-opacity:1" />
    </linearGradient>
    
    <!-- Ridge highlight gradient -->
    <linearGradient id="ridgeHighlight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f8f8f8;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Base white background -->
  <rect width="256" height="256" fill="url(#fabricTexture)"/>
  
  <!-- Tent ridges (peaks) - creates 3D tent roof appearance -->
  <g id="tentRidges">
    <!-- Ridge 1 -->
    <rect x="0" y="0" width="32" height="256" fill="url(#ridgeShadow)"/>
    <rect x="32" y="0" width="32" height="256" fill="url(#ridgeHighlight)"/>
    
    <!-- Ridge 2 -->
    <rect x="64" y="0" width="32" height="256" fill="url(#ridgeShadow)"/>
    <rect x="96" y="0" width="32" height="256" fill="url(#ridgeHighlight)"/>
    
    <!-- Ridge 3 -->
    <rect x="128" y="0" width="32" height="256" fill="url(#ridgeShadow)"/>
    <rect x="160" y="0" width="32" height="256" fill="url(#ridgeHighlight)"/>
    
    <!-- Ridge 4 -->
    <rect x="192" y="0" width="32" height="256" fill="url(#ridgeShadow)"/>
    <rect x="224" y="0" width="32" height="256" fill="url(#ridgeHighlight)"/>
  </g>
  
  <!-- Center ridge lines for depth -->
  <g id="ridgeLines" opacity="0.3">
    <line x1="32" y1="0" x2="32" y2="256" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="96" y1="0" x2="96" y2="256" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="160" y1="0" x2="160" y2="256" stroke="#c8c8c8" stroke-width="1"/>
    <line x1="224" y1="0" x2="224" y2="256" stroke="#c8c8c8" stroke-width="1"/>
  </g>
  
  <!-- Vertical support lines (tent poles) -->
  <g id="supportLines" opacity="0.15">
    <line x1="0" y1="0" x2="0" y2="256" stroke="#b4b4b4" stroke-width="2"/>
    <line x1="64" y1="0" x2="64" y2="256" stroke="#b4b4b4" stroke-width="2"/>
    <line x1="128" y1="0" x2="128" y2="256" stroke="#b4b4b4" stroke-width="2"/>
    <line x1="192" y1="0" x2="192" y2="256" stroke="#b4b4b4" stroke-width="2"/>
    <line x1="256" y1="0" x2="256" y2="256" stroke="#b4b4b4" stroke-width="2"/>
  </g>
</svg>
