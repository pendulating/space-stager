name: Docs CI

on:
  pull_request:
    paths:
      - 'docs-site/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
  push:
    branches: [ main ]
    paths:
      - 'docs-site/**'
      - 'scripts/**'
      - 'src/**'
      - 'package.json'
      - 'pnpm-lock.yaml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
      - name: Install deps
        run: pnpm install --frozen-lockfile=false
      - name: Markdownlint
        run: npx markdownlint-cli2 "docs-site/**/*.md" "docs-site/**/*.mdx"
      - name: Vale (prose)
        run: |
          curl -fsSL https://github.com/errata-ai/vale/releases/download/v3.8.0/vale_3.8.0_Linux_64-bit.tar.gz | tar -xz
          ./vale sync
          ./vale docs-site
      - name: Build docs
        run: pnpm run docs:gen:react && pnpm run docs:gen:js && pnpm run docs:gen:constants && pnpm --dir docs-site build


